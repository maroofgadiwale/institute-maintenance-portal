<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Changes Done</title>
    <link rel="stylesheet" href="css/styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Shortcut icon -->
    <link rel="shortcut icon" type="images/png" href="images/done.png">
    <!-- Google Fonts link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&family=Questrial&display=swap" rel="stylesheet">
    <!-- Bootstrap link -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <style>
      p{
        font-family: "Poppins",sans-serif;
        color:white;
        font-size:1.5rem;
      }
      .wrong-auth{
        margin-top:8%;
        text-align: center;
      }
      #title{
        animation: none;
      }
      .done{
        animation: dance 1s 3;
      }
      @keyframes dance {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }
      @media only screen and (max-width:768px){
        .wrong-auth{
          margin-top:50%;
        }
        #title{
          font-size: 2rem;
        }
        p{
          font-size: 1.2rem;
        }
        .telescope{
          height: 200px;
          width: 200px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container wrong-auth">
        <img src="images/done.png" class="done" alt="Done" height="200px" width="200px">
        <h1 id="title" class="dance">Done!👍🏻</h1>
        <p>Changes has been successfully made to the Technicians Database</p>
    </div>
  </body>
</html>
