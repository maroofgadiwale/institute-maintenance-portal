<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Issue Submitted</title>
  <!-- Shortcut icon -->
  <link rel="shortcut icon" type="image/png" href="images/complete.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Fonts link -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300&family=Questrial&display=swap" rel="stylesheet">
  <!-- Bootstrap link -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  <!-- Capturing image link.. -->
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.js"></script>
  <style>
    body {
      background-color: #c471ed;
      color: white;
    }

    .confirm {
      margin-top: 10%;
      text-align: center;
      font-family: "Poppins", sans-serif;
      justify-content: center;
    }

    .response {
      margin-top: 2%;
      font-size: 2.5rem;
    }

    .home {
      width: 35%;
      margin-top: 1%;
      border-radius: 25px;
      outline: 3px solid white;
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
      height: 50px;
      margin-right: 2%;
    }

    .info {
      margin-top: 1%;
      font-size: 1.3rem;
      white-space:pre-line;
    }


    @media only screen and (max-width:768px) {
      .confirm {
        margin-top: 45%;
      }

      .response {
        font-size: 1.8rem;
        margin-top: 3%;
      }

      .completion {
        height: 150px;
        width: 150px;
      }

      .info {
        margin-top: 1%;
        font-size: 1rem;
        white-space: normal;
      }

      .home {
        text-decoration: none;
        width: 50%;
        margin-top: 2%;
        border-radius: 25px;
        outline: 3px solid white;
        color: white;
        font-size: 1rem;
        font-weight: bold;
        height: 55px;
      }
      .first{
        margin-bottom: 2%;
      }
    }
  </style>
</head>

<body>
  <div class="container confirm">
    <img src="images/complete.png" alt="completion" class="completion" height="180px" width="180px">
    <h1 class="response">Issue Submitted</h1>
    <p class="info">Your issue regarding the maintenance has been submitted to the principal
      of your institute and you will soon get a status from the technician regarding the maintenance task.</p>
    <a href="home.php">
      <button type="button" class="btn btn-info home first" name="button">BACK TO HOME PAGE</button>
    </a>
      <button type="button" class="btn btn-info home" name="button" onclick="takeShot()">DOWNLOAD RECEIPT</button>
  </div>
  <script type="text/javascript">
    function takeShot() {
      html2canvas(document.documentElement).then(canvas => {
        // Convert the canvas to a data URL
        const imageDataUrl = canvas.toDataURL('image/png');
        // Create a temporary link and trigger a download
        const link = document.createElement('a');
        link.href = imageDataUrl;
        link.download = 'confirmation';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    }
  </script>
</body>

</html>
